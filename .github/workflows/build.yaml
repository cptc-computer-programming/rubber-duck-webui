# ─────────────────────────────────────────────────────────────────────────────
# Build — confirms the project builds on every push and pull request to main.
#   • Frontend: installs npm dependencies from the lockfile and runs the
#     production SvelteKit build (same steps as the Dockerfile's build stage).
#   • Backend: byte-compiles the Python sources to catch syntax errors.
# Can also be started by hand from the Actions tab ("Run workflow").
# ─────────────────────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # --force matches the Dockerfile; some dependencies have peer-dep conflicts.
      - name: Install dependencies
        run: npm ci --force

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          APP_BUILD_HASH: ${{ github.sha }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          retention-days: 7

  backend:
    name: Backend compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Byte-compile Python sources
        run: python -m compileall -q backend/open_webui
